# Project-wide Gradle settings.

# Enable AndroidX – required because all dependencies use androidx.* artifacts
android.useAndroidX=true

# Automatically convert any remaining support library dependencies to AndroidX
android.enableJetifier=true

# Use the new R8 full mode for smaller release APKs
android.enableR8.fullMode=false

# Increase Gradle daemon memory for large projects
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style
kotlin.code.style=official
